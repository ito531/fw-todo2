<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ToDo</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <p class="flash" th:if="${message}" th:text="${message}">登録しました</p>
        <h1 class="page-title" th:text="${trash ? 'ゴミ箱' : 'ToDo'}">ToDo</h1>

        <div class="page-actions">
            <a class="btn" th:href="@{/todos/new}">＋ 新規登録</a>
            <a class="btn sub" th:href="@{/focus}">今日のフォーカス</a>
            <a class="btn sub" th:href="@{/calendar}">カレンダー</a>
            <a class="btn sub" th:href="@{/api/todos.csv(keyword=${keyword}, category=${category}, order=${order}, includeCompleted=${includeCompleted}, trash=${trash ? 1 : 0})}">CSV出力</a>
            <a class="btn sub" th:unless="${trash}" th:href="@{/todos(trash=1)}">ゴミ箱</a>
            <a class="btn sub" th:if="${trash}" th:href="@{/todos}">一覧に戻る</a>
        </div>

        <form class="search-bar" th:action="@{/todos}" method="get">
            <div>
                <label class="form-label" for="keyword">やること</label>
                <input class="form-input" id="keyword" type="text" name="keyword" th:value="${keyword}">
            </div>
            <div>
                <label class="form-label" for="category">ジャンル</label>
                <select class="form-input" id="category" name="category">
                    <option value="" th:selected="${#strings.isEmpty(category)}">すべて</option>
                    <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                    <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                    <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                    <option value="資格" th:selected="${category == '資格'}">資格</option>
                    <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
                </select>
            </div>
            <input type="hidden" name="order" th:value="${order}">
            <input type="hidden" name="page" value="1">
            <input type="hidden" name="trash" th:value="${trash ? 1 : 0}">
            <label class="filter-check">
                <input type="checkbox" name="includeCompleted" value="true" th:checked="${includeCompleted}">
                完了したものも表示する
            </label>
            <button class="btn" type="submit">絞り込む</button>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='asc', includeCompleted=${includeCompleted}, trash=${trash ? 1 : 0}, page=${page})}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='desc', includeCompleted=${includeCompleted}, trash=${trash ? 1 : 0}, page=${page})}">期限が遠い順</a>
        </form>

        <p th:if="${#lists.isEmpty(todos)}" class="empty-state">まだ1件も登録されていません</p>

        <div class="table-card" th:unless="${#lists.isEmpty(todos)}">
        <table class="todo-table">
            <thead>
                <tr>
                    <th>やること</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}" th:attr="data-due-date=${todo.dueDate},data-completed=${todo.completed}">
                    <td class="todo-title" th:text="${todo.title}">やること</td>
                    <td><span class="category-tag" th:text="${todo.category}">ジャンル</span></td>
                    <td><span class="priority-tag" th:classappend="| priority-${todo.priority}|" th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">優先度</span><span class="priority-high-marker" th:if="${todo.priority == 1}" aria-label="優先度が高い">★</span></td>
                    <td class="due-date" th:text="${todo.dueDate == null ? '期限なし' : todo.dueDate}">期限</td>
                    <td><span class="status-tag" th:classappend="${todo.completed ? ' status-complete' : ' status-open'}" th:text="${todo.completed ? '完了' : '未完了'}">状態</span></td>
                    <td class="table-actions" th:unless="${trash}"><a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a><a class="link danger-link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a></td>
                    <td class="table-actions" th:if="${trash}"><form th:action="@{/todos/{id}/restore(id=${todo.id})}" method="post"><button class="btn sub compact" type="submit">戻す</button></form></td>
                </tr>
            </tbody>
        </table>
        </div>
        <nav class="pagination" th:if="${totalPages > 1}" aria-label="ページ番号">
            <span th:each="pageNumber : ${#numbers.sequence(1, totalPages)}">
                <span th:if="${pageNumber == page}" th:text="${pageNumber}">1</span>
                <a class="link" th:unless="${pageNumber == page}" th:href="@{/todos(keyword=${keyword}, category=${category}, order=${order}, includeCompleted=${includeCompleted}, trash=${trash ? 1 : 0}, page=${pageNumber})}" th:text="${pageNumber}">2</a>
            </span>
        </nav>
    </div>
    <script>
        const now = new Date();
        const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

        document.querySelectorAll("tr[data-due-date]").forEach((row) => {
            if (row.dataset.dueDate && row.dataset.dueDate < today && row.dataset.completed === "false") {
                row.classList.add("todo-overdue");
            }
        });
    </script>
</body>
</html>
