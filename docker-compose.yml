services:
  db-app2:
    image: mysql:8.0
    container_name: fw-mysql2
    environment:
      MYSQL_DATABASE: todoapp2
      MYSQL_ROOT_PASSWORD: password
      TZ: Asia/Tokyo
    command: --default-time-zone=+09:00
    ports:
      - "3306:3306"
    volumes:
      - fw-db-data:/var/lib/mysql

volumes:
  fw-db-data:
